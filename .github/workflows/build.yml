# Build + unit tests for every push to main and every pull request.
name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the tag-derived version is X.Y.Z-SNAPSHOT rather
          # than 0.0.0-SNAPSHOT on branches.
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4
        with:
          # Install exactly what the build needs instead of relying on the
          # runner image's preinstalled SDK.
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - uses: gradle/actions/setup-gradle@v6

      # Always the wrapper: it pins Gradle 8.9, which AGP 8.7.3 requires.
      # The app's release build (R8) is what users install, so keep it
      # verified on every PR as well.
      - name: Assemble library and app
        run: |
          set -o pipefail
          ./gradlew :soniq-base:assembleDebug :app:assembleDebug \
              :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Test release automation
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Run JVM unit tests
        run: |
          set -o pipefail
          ./gradlew :soniq-base:testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee test.log

      # Job logs are not reachable from every environment that maintains this
      # repository; repeat the error summary as annotations so it is visible
      # through the checks API.
      - name: Surface Gradle errors as annotations
        if: failure()
        run: |
          {
            grep -hE '^e: |What went wrong|Execution failed|Caused by|error:|: Error: |: Fatal: |FAILURE:' build.log test.log 2>/dev/null || true
            grep -h -A12 'What went wrong' build.log test.log 2>/dev/null || true
          } | head -60 | while IFS= read -r line; do echo "::error title=gradle::$line"; done

      - name: Upload app APK
        uses: actions/upload-artifact@v7
        with:
          name: spinback-google-play-music-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload library AAR
        uses: actions/upload-artifact@v7
        with:
          name: soniq-base-debug-aar
          path: soniq-base/build/outputs/aar/*.aar
